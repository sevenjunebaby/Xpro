<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Recorder UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #camera-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3 / 4;
      background-color: #000;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
    }
    .indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #444;
      border: 2px solid #fff;
      transition: background-color 0.3s;
    }
    #sound-indicator.active {
      background-color: yellow;
    }
    #camera-indicator.active {
      background-color: green;
    }
    #object-indicator.active {
      background-color: red;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    button {
      padding: 10px 15px;
      background-color: #1f1f1f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }
    #timer {
      font-size: 20px;
      font-weight: bold;
      min-width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="camera-container">
    <img id="video" src="/video_feed" alt="Camera video feed" style="width: 100%; height: 100%; object-fit: cover;" />
    <div class="overlay">
      <div id="camera-indicator" class="indicator"></div>
      <div id="sound-indicator" class="indicator"></div>
      <div id="object-indicator" class="indicator"></div>
    </div>
  </div>

  <div class="controls">
    <button id="switchCamera" title="Not implemented yet">Switch Camera</button>
    <div id="timer">00:00</div>
  </div>

  <script>
  const socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + "/ws");

  socket.onmessage = function(event) {
    const data = JSON.parse(event.data);
    document.getElementById('object-indicator').classList.toggle('active', data.object_detection.detected);
    document.getElementById('camera-indicator').classList.toggle('active', data.camera_status.active);
  };

  // Simulate sound detection indicator
  setInterval(() => {
    const active = Math.random() > 0.7;
    document.getElementById('sound-indicator').classList.toggle('active', active);
  }, 1000);

  // Timer logic
  const timerDisplay = document.getElementById('timer');
  let seconds = 0;
  setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerDisplay.textContent = `${m}:${s}`;
  }, 1000);

  // Switch camera button (frontend only)
  document.getElementById('switchCamera').addEventListener('click', () => {
    alert("Camera switching handled on backend - not implemented yet.");
  });
  </script>
</body>
</html>
